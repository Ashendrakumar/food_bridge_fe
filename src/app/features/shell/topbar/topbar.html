<div class="topbar">
  <div class="flex items-center gap-2">
    <div>
      <button
        type="button"
        class="btn-icon"
        title="Toggle sidebar"
        aria-label="Toggle sidebar"
        (click)="layout.toggleSidebar()"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div class="search-box hidden md:block">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Search listings, NGOs, volunteers..." />
    </div>
  </div>

  <div class="flex items-center gap-4">
    @if (availability.appliesToCurrentUser()) {
      <button
        type="button"
        class="active-toggle"
        [class.is-on]="availability.isActive()"
        (click)="availability.toggle()"
        title="Toggle your availability"
      >
        <span class="dot"></span>
        <span>{{ availability.label() }}</span>
      </button>
    }

    <div class="relative">
      <button type="button" class="btn-icon" (click)="theme.toggle()">
        <i [class]="theme.darkMode() ? 'fa-solid fa-sun' : 'fa-solid fa-circle-half-stroke'"></i>
      </button>
    </div>

    <!-- Notifications -->
    <div class="relative">
      <button type="button" class="btn-icon" (click)="toggleNotif()">
        <i class="fa-solid fa-bell"></i>
        @if (notifications.count()) {
          <span class="notif-badge">{{ notifications.count() }}</span>
        }
      </button>
      @if (notifOpen()) {
        <div class="dropdown-panel w-[320px]">
          <div class="px-2 py-1 font-semibold text-sm">Notifications</div>
          @for (n of notifications.notifications(); track $index) {
            <div class="notif-item">
              <span class="notif-dot"></span>
              <div>
                <div class="text-[13px]">{{ n.text }}</div>
                <div class="text-muted text-[11px]">{{ n.time }}</div>
              </div>
            </div>
          } @empty {
            <div class="text-muted text-center py-3 text-[13px]">No notifications</div>
          }
        </div>
      }
    </div>

    <!-- Profile -->
    <div class="relative">
      <button type="button" class="avatar-btn" (click)="toggleMenu()">
        <app-avatar [name]="userName()" [imageUrl]="avatarUrl()" [size]="40" />
      </button>
      @if (menuOpen()) {
        <div class="dropdown-panel w-[220px]">
          <div class="px-3 pt-2 pb-2.5 border-b border-line mb-1">
            <div class="font-semibold text-sm truncate">{{ userName() }}</div>
            <app-role-badge class="mt-1.5" [role]="role()" size="sm" />
          </div>
          <a class="dropdown-item" (click)="go('profile')"
            ><i class="fa-solid fa-user"></i>Profile</a
          >
          <a class="dropdown-item" (click)="go('settings')"
            ><i class="fa-solid fa-gear"></i>Settings</a
          >
          <a class="dropdown-item" (click)="helpSoon()">
            <i class="fa-solid fa-circle-question"></i>Help
          </a>
          <hr class="my-1 border-line" />
          <a class="dropdown-item !text-red-600" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>Logout
          </a>
        </div>
      }
    </div>
  </div>

  @if (notifOpen() || menuOpen()) {
    <div class="menu-backdrop" (click)="closeMenus()"></div>
  }
</div>
